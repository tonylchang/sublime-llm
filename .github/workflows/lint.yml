name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # host for ruff only; the code targets 3.8 via ruff.toml
      - run: pip install ruff
      - run: ruff check .
