# Lint config for the LLM Sublime Text package. Dev-only: export-ignored from
# the shipped package (see .gitattributes) and not a runtime dependency.
#
# The plugin runs on Sublime's bundled Python 3.8 host and is stdlib-only.
target-version = "py38"
line-length = 88

[lint]
# Start conservative and high-signal — this is ruff's default rule set:
#   F  = Pyflakes        (unused imports/vars, undefined names, f-strings)
#   E4 = import placement, E7 = statement issues, E9 = syntax/runtime errors
# Deliberately NOT enabled yet, each a tracked follow-up:
#   E501 (line length)   -> comes with an opt-in `ruff format` pass
#   I    (import order)  -> mechanical; enable once the tree is sorted
#   BLE  (blind except)  -> the ~120 `except Exception:` audit; 8 sites already
#                           carry `# noqa: BLE001`, so enable BLE there, not here
# `select` is explicit so the enforced set stays stable across ruff versions.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# plugin.py imports command/listener classes purely to register them with the
# Sublime plugin host (F401), and does so after the reload shim rather than at
# the top of the file (E402). Both are intentional for this entry point.
"plugin.py" = ["F401", "E402"]
